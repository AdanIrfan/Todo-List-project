<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
        <div id = "app">
            <header id = "header">
                <h1>Todo App</h1>
            </header>

            <aside id = "sidebar">
                <h1>Projects</h1>
                <ul id = "projects"></ul>
                <button id = "addProject">Add project</button>
                <dialog id = "dialogBox">
                    <form id = "projectForm">

                        <h1>Add Project</h1>
                        
                        <label for = "projectInput">Project Name</label>
                        <input type = "text" id = "projectInput" placeholder="Enter the project name">
                        
                        <button type = "button" id = "closeButton">close</button>
                        <button type = "submit" id = "submitButton">create</button>
                    </form>
                </dialog>
            </aside>

            <main id = "main">
                <h1 id = "projectName"></h1>
                <ul id = "tasks"></ul>
                <button id = "addTask">Add task</button>
            </main>

        </div>
</body>
</html>
